{% extends 'base.html' %}

{% block title %}
{% if form.instance.id %}
Edit Book
{% else %}
Add Book
{% endif %}
{% endblock %}

{% block content %}

<div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">

    <h2 class="text-center mb-4">
        {% if form.instance.id %}
            Edit Book
        {% else %}
            Add Book
        {% endif %}
    </h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-100">
            {% if form.instance.id %}
                Update Book
            {% else %}
                Add Book
            {% endif %}
        </button>

    </form>

    <div class="text-center mt-3">
        <a href="/books/" class="btn btn-secondary">
            Back to Books
        </a>
    </div>

</div>

{% endblock %}
